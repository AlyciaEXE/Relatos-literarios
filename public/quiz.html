<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href=".\css\quiz.css">
</head>

<body>

    <nav class="navbar">

        <div class="container nav-content">

            <div class="nav-logo">文豪ストレイドッグス</div>

            <div class="nav-links">
                <a href="home.html" class="nav-ativo">Home</a>
                <a href="login.html" class="nav-login">Entrar</a>
                <a href="cadastro.html" class="nav-cadastro">Cadastrar</a>
            </div>

        </div>

    </nav>


    <div id="jogo" class="quiz-card">

        <div class="cabecalhoPergunta">

            <div id="infoQuestao">
                QUESTÃO
                <span id="spanNumeroDaQuestaoAtual"></span>
                /
                <span id="qtdQuestoes"></span>
            </div>

            <div id="perguntaDaQuestaoAtual">
                <span id="spanQuestaoExibida"></span>
            </div>

        </div>

<div id="opcoes" class="options-group">

    <label class="opcao">

        <input type="radio" id="primeiraOpcao" name="option" class="radio">

        <span id="labelOpcaoUm"></span>

    </label>

    <label class="opcao">

        <input type="radio" id="segundaOpcao" name="option" class="radio">

        <span id="labelOpcaoDois"></span>

    </label>

</div>


        <div class="controles">

            <button onclick="avancar()" id="btnProx" class="btn-proxima">
                Próxima
            </button>

        </div>

    </div>

</body>

<script>



const listaDeQuestoes = [

    {
        pergunta: "O que mais te atrai em uma história?",

        alternativaA: "Profundidade psicológica e questionamentos existenciais",

        alternativaB: "Beleza lírica e expressão emocional"
    },

    {
        pergunta: "Qual estilo de escrita você prefere?",

        alternativaA: "Prosa introspectiva e sombria",

        alternativaB: "Versos poéticos e melódicos"
    },

    {
        pergunta: "Que tipo de protagonista te interessa?",

        alternativaA: "Alguém lutando contra seus próprios demônios internos",

        alternativaB: "Alguém expressando suas emoções através da arte"
    }

];



let numeroDaQuestaoAtual = 0;

let pontosDazai = 0;

let pontosChuuya = 0;



function preencherHTMLcomQuestaoAtual(i) {

    const questaoAtual = listaDeQuestoes[i];

    spanNumeroDaQuestaoAtual.innerHTML = i + 1;

    qtdQuestoes.innerHTML = listaDeQuestoes.length;

    spanQuestaoExibida.innerHTML = questaoAtual.pergunta;

    labelOpcaoUm.innerHTML = questaoAtual.alternativaA;

    labelOpcaoDois.innerHTML = questaoAtual.alternativaB;
}



function avancar() {

    let respondeu = false;

    if (primeiraOpcao.checked || segundaOpcao.checked) {

        respondeu = true;
    }

    if (!respondeu) {

        alert("Escolha uma alternativa!");

        return;
    }

    salvarResposta();

    desmarcarRadioButtons();

    numeroDaQuestaoAtual++;

    if (numeroDaQuestaoAtual < listaDeQuestoes.length) {

        preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual);

    } else {

        mostrarResultado();
    }
}



function salvarResposta() {

    if (primeiraOpcao.checked) {

        pontosDazai++;
    }

    if (segundaOpcao.checked) {

        pontosChuuya++;
    }
}



function desmarcarRadioButtons() {

    primeiraOpcao.checked = false;

    segundaOpcao.checked = false;
}



function mostrarResultado() {

    jogo.innerHTML = "";

    let idAutor;

    if (pontosDazai > pontosChuuya) {

        idAutor = 2;

         sessionStorage.FOTO_USUARIO = "public\assets\imgs\perfil\pefil-dazai.jpg";

        jogo.innerHTML = `
        
        <h1>Você combina com Osamu Dazai!</h1>

        <p>
        Sua personalidade é introspectiva, inteligente e profunda.
        </p>

        <p>
        Livro recomendado: Indigno de Ser Humano
        </p>

        <div class="controles">

            <a href="dazai.html">
                <button class="btn-proxima">
                    Ver Página do Autor
                </button>
            </a>

        </div>
        `;

    } else {

        idAutor = 1;

        sessionStorage.FOTO_USUARIO =  "public\assets\imgs\perfil\pefil-chuuya.jpg";


        jogo.innerHTML = `
        
        <h1>Você combina com Chuuya Nakahara!</h1>

        <p>
        Você possui uma personalidade intensa, emocional e apaixonada.
        </p>

        <p>
        Livro recomendado: Songs of a Goat
        </p>

        <div class="controles">

            <a href="chuuya.html">
                <button class="btn-proxima">
                    Ver Página do Autor
                </button>
            </a>

        </div>
        `;
    }

    salvarNoBanco();
}




function salvarNoBanco() {

    let idUsuario = sessionStorage.ID_USUARIO;

    let idAutor;

    if (pontosDazai > pontosChuuya) {

        idAutor = 2;

    } else {

        idAutor = 1;
    }

    fetch("/quiz/salvarResultado", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

      body: JSON.stringify({

    fkUsuario: idUsuario,
    fkAutor: idAutor

})

    })

    .then(function(resposta){

        console.log("Resultado salvo!");

    })

    .catch(function(erro){

        console.log(erro);

    });

}



preencherHTMLcomQuestaoAtual(0);


</script>

</html>
