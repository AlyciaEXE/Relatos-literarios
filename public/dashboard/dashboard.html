<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../CSS/dashboards.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="nav-content">

            <div class="nav-logo">
                文豪ストレイドッグス
            </div>

            <div class="nav-links">

                <a href="../chuuya.html" class="nav-chuuya">CHUUYA</a>

                <a href="../dazai.html" class="nav-dazai">DAZAI</a>

                <a href="../quiz.html" class="nav-quiz">Quiz</a>

                <a href="../login.html" class="nav-login">Entrar</a>

                <a href="../cadastro.html" class="nav-cadastro">Cadastrar</a>

            </div>

        </div>

    </nav>


    <!-- DASHBOARD -->

    <div class="dashboard">

        <!-- CARDS -->

        <div class="cards-dashboard">

            <div class="card-info">

                <h2 id="Chuuya">0</h2>

                <p>Respostas Chuuya</p>

            </div>


            <div class="card-info">

                <h2 id="Dazai">0%</h2>

                <p>Respostas Dazai</p>

            </div>


            <div class="card-info">

                <h2 id="Usuarios">0</h2>

                <p>Usuários Cadastrados</p>

            </div>

        </div>


        <!-- GRAFICO -->

        <div class="grafico-card">

            <h2>Gráfico Comparativo</h2>

            <div class="grafico-container">

                <canvas id="graficoPerfis"></canvas>

            </div>

        </div>
    </div>

    </div>

    </div>

</body>
<script>
    const ctx = document.getElementById('graficoPerfis');

    fetch("/dashboard/buscarResultados")

        .then(function (resposta) {

            return resposta.json();

        })

        .then(function (dados) {

            console.log(dados);
            let votosDazai = dados[0].votosDazai;

            let votosChuuya = dados[0].votosChuuya;

            let votosTotais = dados[0].votosDazai + dados[0].votosChuuya;

            let totalUsuarios = dados[0].totalUsuarios;

            let PorcentagemChuuya = (votosChuuya / votosTotais) * 100;
            let PorcentagemDazai = (votosDazai / votosTotais) * 100;

            document.getElementById("Dazai").innerHTML = `${PorcentagemDazai.toFixed(0)}%`;

            document.getElementById("Chuuya").innerHTML = `${PorcentagemChuuya.toFixed(0)}%`;

            document.getElementById("Usuarios").innerHTML = totalUsuarios;




            const ctx = document.getElementById('graficoPerfis');

            new Chart(ctx, {

                type: 'pie',

                data: {

                    labels: [
                        'Dazai',
                        'Chuuya'
                    ],

                    datasets: [{

                        data: [votosDazai, votosChuuya],

                        backgroundColor: [
                            '#89CFF0',
                            '#F4B183'
                        ],

                        borderWidth: 2

                    }]
                },

                options: {

                    responsive: true,

                    plugins: {

                        legend: {

                            labels: {

                                color: 'white',

                                font: {
                                    size: 14
                                }
                            }
                        }
                    }
                }
            });

        });

</script>

</html>
