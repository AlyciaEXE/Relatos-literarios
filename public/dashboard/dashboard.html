<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="../CSS/dashboards.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="perfil-sidebar">

            <div class="foto-usuario">

                <img id="imagemUsuario">

            </div>

            <h2 id="nomeUsuarioSidebar">Usuário</h2>

            <p>Logado</p>

        </div>

        <a href="../home.html">Home</a>

        <a href="../quiz.html">Quiz</a>

        <a href="../dazai.html">Dazai</a>

        <a href="../chuuya.html">Chuuya</a>





    </div>


    <!-- CONTAINER -->

    <div class="dashboard-container">


        <!-- DASHBOARD -->

        <div class="dashboard">


            <!-- NAVBAR -->

            <nav class="navbar">

                <div class="nav-content">

                    <div class="nav-logo">
                        文豪ストレイドッグス
                    </div>

                    <div class="nav-links">

                        <a href="../login.html">Entrar</a>

                        <a href="../cadastro.html">Cadastrar</a>

                    </div>

                </div>

            </nav>


            <!-- CARDS -->

            <div class="cards-dashboard">


                <!-- CHUUYA -->

                <div class="card-info">

                    <h2 id="Chuuya">0%</h2>

                    <p>Respostas Chuuya</p>

                </div>


                <!-- DAZAI -->

                <div class="card-info">

                    <h2 id="Dazai">0%</h2>

                    <p>Respostas Dazai</p>

                </div>


                <!-- USUARIOS -->

                <div class="card-info">

                    <h2 id="Usuarios">0</h2>

                    <p>Usuários Cadastrados</p>

                </div>






            </div>


            <!-- GRAFICO -->

            <div class="grafico-area">

                <div class="grafico-card" id="grafico">

                    <h2>Gráfico Comparativo</h2>

                    <div class="grafico-container">

                        <canvas id="graficoPerfis"></canvas>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

<script>
    if (sessionStorage.ID_USUARIO == undefined) {

        alert("Você precisa estar logado para acessar a dashboard!");

        window.location = "../login.html";
    }

    let nome = sessionStorage.NOME_USUARIO;

    document.getElementById("nomeUsuarioSidebar").innerHTML = nome;

    document.getElementById("imagemUsuario").src = sessionStorage.getItem("FOTO_USUARIO") || "../assets/imgs/Perfil/perfil-dazai.jpg";

    fetch("/dashboard/buscarResultados")

        .then(function (resposta) {

            return resposta.json();

        })

        .then(function (dados) {

            console.log(dados);

            let votosDazai = Number(dados[0].votosDazai) || 0;

            let votosChuuya = Number(dados[0].votosChuuya) || 0;

            let votosTotais = votosDazai + votosChuuya;

            let totalUsuarios = Number(dados[0].totalUsuarios) || 0;

            let porcentagemChuuya = 0;

            let porcentagemDazai = 0;


            if (votosTotais > 0) {

                porcentagemChuuya = (votosChuuya / votosTotais) * 100;

                porcentagemDazai = (votosDazai / votosTotais) * 100;
            }


            document.getElementById("Dazai").innerHTML =
                `${porcentagemDazai.toFixed(0)}%`;

            document.getElementById("Chuuya").innerHTML =
                `${porcentagemChuuya.toFixed(0)}%`;

            document.getElementById("Usuarios").innerHTML =
                totalUsuarios;


            const ctx = document.getElementById('graficoPerfis');

            new Chart(ctx, {

                type: 'pie',

                data: {

                    labels: [
                        'Dazai',
                        'Chuuya'
                    ],

                    datasets: [{

                        data: [votosDazai, votosChuuya],

                        backgroundColor: [
                            '#89CFF0',
                            '#F4B183'
                        ],

                        borderWidth: 2

                    }]
                },

                options: {

                    responsive: true,

                    plugins: {

                        legend: {

                            labels: {

                                color: 'white',

                                font: {
                                    size: 14
                                }
                            }
                        }
                    }
                }
            });

        });

</script>

</html>
